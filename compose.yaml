services:
  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: contactos
    ports:
      - "3307:3306"
    volumes:
      - database_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psa"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  database_data:
